services:
  cmake:
    container_name: bel
    build:
      context: .
      dockerfile: Dockerfile

    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 2
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:8080:8080"
